[package]
name = "simple-transaction"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "apply_transactions"
harness = false
